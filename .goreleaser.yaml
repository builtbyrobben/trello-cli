version: 2

project_name: trello-cli

changelog:
  disable: true

builds:
  - id: trello
    main: ./cmd/trello
    binary: trello-cli
    ldflags: >-
      -s -w
      -X github.com/builtbyrobben/trello-cli/internal/cmd.version={{ .Tag }}
      -X github.com/builtbyrobben/trello-cli/internal/cmd.commit={{ .ShortCommit }}
      -X github.com/builtbyrobben/trello-cli/internal/cmd.date={{ .Date }}
    env:
      - CGO_ENABLED=0
    targets:
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: trello_darwin
    main: ./cmd/trello
    binary: trello-cli
    ldflags: >-
      -s -w
      -X github.com/builtbyrobben/trello-cli/internal/cmd.version={{ .Tag }}
      -X github.com/builtbyrobben/trello-cli/internal/cmd.commit={{ .ShortCommit }}
      -X github.com/builtbyrobben/trello-cli/internal/cmd.date={{ .Date }}
    env:
      - CGO_ENABLED=1
    targets:
      - darwin_amd64
      - darwin_arm64

archives:
  - builds:
      - trello
      - trello_darwin
    format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: checksums.txt

brews:
  - repository:
      owner: builtbyrobben
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    folder: Formula
    homepage: "https://github.com/builtbyrobben/trello-cli"
    description: "Trello board and card management CLI"
    license: "MIT"
    test: |
      system "#{bin}/trello-cli", "--version"
